    <path d="m622 499 68 105m-68-105-22-89" stroke="#a34b3d" stroke-width="12"/>
    <path d="m622 496 68 105m-68-105-22-86" stroke="#df7358" stroke-width="7"/>
    <path d="m384 461-8-29" stroke="#536966" stroke-width="9"/>
    <path d="m600 410 28-20q18-6 25 7" stroke="#536966" stroke-width="9"/>
    <path d="m631 390 20 6" stroke="#293e43" stroke-width="12"/>
