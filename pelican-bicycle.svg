  <path d="m275 347-75-26 29 49-19 8 72 29Z" fill="#344d52" stroke="#293e43" stroke-width="4" stroke-linejoin="round"/>
  <path d="m260 357-43-23 28 33" fill="#fdfbf0"/>
  <path d="M444 407q16 27 45 69a13 13 0 0 1 1 13l-19 85" fill="none" stroke="#d99343" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m471 568 10 8 28 4-5 10-43-1q-9-4 1-15Z" fill="#e4a14c" stroke="#95683b" stroke-width="3" stroke-linejoin="round"/>
