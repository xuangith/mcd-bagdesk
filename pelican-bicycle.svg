  <path d="m779 233 10 1-10 8" fill="#b77935"/>
  <ellipse cx="533" cy="205" rx="14" ry="16" fill="#ead9a9"/>
  <circle cx="535" cy="205" r="7" fill="#263e44"/>
  <circle cx="537" cy="202" r="2.5" fill="#fff"/>
