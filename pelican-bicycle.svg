  <use href="#wheel" x="270" y="604"/>
  <use href="#wheel" x="690" y="604"/>
  <path d="m388 416-36 88 78 112" fill="none" stroke="#bd7939" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m424 614 24 6-9 10-36-4Z" fill="#d39043" stroke="#8b6039" stroke-width="3" stroke-linejoin="round"/>
