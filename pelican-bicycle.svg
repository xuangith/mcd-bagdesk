<svg xmlns="http://www.w3.org/2000/svg" width="960" height="800" viewBox="0 0 960 800" role="img" aria-labelledby="title description">
  <title id="title">A pelican out for a bicycle ride</title>
  <desc id="description">A cheerful white pelican with a long golden bill and a teal scarf pedals a coral-red bicycle beneath a warm sun.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#f9f2df"/>
      <stop offset="1" stop-color="#fffaf0"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0.4" y2="1">
      <stop stop-color="#ffc965"/>
      <stop offset="1" stop-color="#efa348"/>
    </linearGradient>
    <linearGradient id="feathers" x2="0.6" y2="1">
      <stop stop-color="#fffef7"/>
      <stop offset="1" stop-color="#e3e9df"/>
    </linearGradient>
    <g id="wheel">
      <circle r="116" fill="#fffaf0" stroke="#293e43" stroke-width="13"/>
      <circle r="105" fill="none" stroke="#adc0ba" stroke-width="3"/>
      <g stroke="#9cafa9" stroke-width="2" stroke-linecap="round">
        <path d="M0-103V103M-103 0H103M-73-73 73 73M-73 73 73-73"/>
        <path d="m-39-95 78 190m-134-56 190-78m-190 0 190 78m-134 56 78-190"/>
      </g>
      <circle r="11" fill="#f5e8c9" stroke="#293e43" stroke-width="5"/>
    </g>
  </defs>

  <!-- A little coastal sunshine. -->
  <rect width="960" height="800" rx="36" fill="url(#sky)"/>
  <circle cx="740" cy="172" r="79" fill="#f5d77e" opacity=".7"/>
  <g fill="none" stroke="#e4bd69" stroke-width="4" stroke-linecap="round" opacity=".7">
    <path d="m740 65 1-14m75 45 10-10m22 86h15m-49 76 10 10M666 96l-10-10"/>
  </g>
  <path d="M0 571Q151 526 296 568T588 563T960 553V800H0Z" fill="#e1e9d6"/>
  <path d="M0 632Q223 598 447 633T960 618V800H0Z" fill="#d1dfc8"/>
  <path d="M66 727H894" fill="none" stroke="#afc4ad" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="482" cy="726" rx="302" ry="15" fill="#6f8f7c" opacity=".12"/>
  <g fill="none" stroke="#769c81" stroke-width="4" stroke-linecap="round">
