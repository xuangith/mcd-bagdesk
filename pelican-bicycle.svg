  <path d="M447 293q-35 29-75 33l18 14-6 15q52-13 83-49" fill="#60b2a3" stroke="#2a6e6b" stroke-width="3" stroke-linejoin="round"/>
  <path d="M455 275q27 9 49-4l9 21q-27 18-53 6Z" fill="#60b2a3" stroke="#2a6e6b" stroke-width="3"/>
  <path d="m467 282 4 12m13-11 3 10" stroke="#a5d4bb" stroke-width="3" stroke-linecap="round"/>

  <!-- One wing reaches forward to steer. -->
  <path d="M314 333q49-30 104 0l97 52q31 13 102 1l15 14q-70 34-126 9l-64-28q-32 45-80 28l9-12q-33 8-52-8l15-10q-30-1-38-19Z" fill="#344d52" stroke="#293e43" stroke-width="4" stroke-linejoin="round"/>
  <path d="M326 334q43-14 83 9l101 53q36 17 86 5" fill="none" stroke="#5e7878" stroke-width="5" stroke-linecap="round"/>
  <path d="m340 364 40 18m-28-4 31 13" fill="none" stroke="#718b86" stroke-width="3" stroke-linecap="round"/>
  <path d="m614 387 14-2q10 0 12 8l-8 9-15-3" fill="#344d52" stroke="#293e43" stroke-width="3" stroke-linejoin="round"/>

  <g fill="none" stroke="#8ba489" stroke-width="3" stroke-linecap="round">
    <path d="M170 736h38m532 0h54"/>
  </g>
</svg>
