  <path d="M414 338q54-7 51-44-1-14-14-37-15-30 3-58 17-29 54-29 33 0 48 24 16 27-3 47-13 14-35 11-3 15 11 39 20 44-7 75-15 18-45 22" fill="url(#feathers)" stroke="#30484c" stroke-width="4" stroke-linecap="round"/>
